name: Build PS5 Payload

on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld git make
          
      - name: Install PS5 SDK
        run: |
          # 1. 请回老版的 ps5-payload-dev SDK，并保证完整下载（--recursive）
          git clone --recursive https://github.com/ps5-payload-dev/sdk.git ps5-sdk
          cd ps5-sdk
          # 2. 核心步骤：必须先编译 SDK 本身，它才会吐出我们需要的文件
          make
          # 3. 安装到系统目录
          sudo make DESTDIR=/opt/ps5-payload-sdk install
          
      - name: Compile
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          
          # 4. 全球智能搜索那个神出鬼没的 payload.mk
          MK_PATH=$(find /opt/ps5-payload-sdk -name "payload.mk" | head -n 1)
          if [ -z "$MK_PATH" ]; then
            MK_PATH=$(find $GITHUB_WORKSPACE/ps5-sdk -name "payload.mk" | head -n 1)
          fi
          
          echo "已成功定位配置文件路径: $MK_PATH"
          
          # 5. 现场手写一份绝对不会路径冲突的 Makefile
          cat << EOF > Makefile
          TARGET = ps5-syslang
          OBJS = main.o
          CXXFLAGS = -O2 -Wall -std=c++11
          include $MK_PATH
          EOF
          
          # 6. 开始最终编译
          make
          
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: ps5-syslang-elf
          path: "*.elf"
