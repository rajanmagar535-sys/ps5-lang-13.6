name: Build PS5 Payload

on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld git make
          
      - name: Compile
        run: |
          # 1. 完整下载老版 SDK（加上 --recursive 才能把缺失的 toolchain 文件夹下回来）
          git clone --recursive https://github.com/ps5-payload-dev/sdk.git ps5-sdk
          
          # 2. 预先编译 SDK 的基础库，防止缺文件
          cd ps5-sdk
          make
          cd ..
          
          # 3. 设置正确的环境变量路径
          export PS5_PAYLOAD_SDK=$GITHUB_WORKSPACE/ps5-sdk
          
          # 4. 下载原作者的源码项目
          git clone https://github.com/owendswang/ps5-syslang.git build_dir
          
          # 5. 将我们修改好 sprx 后缀的 main.cpp 强行覆盖进去
          cp main.cpp build_dir/main.cpp
          
          # 6. 进入文件夹，使用原作者自带的完美 Makefile 进行编译
          cd build_dir
          make
          
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: ps5-syslang-elf
          path: build_dir/*.elf
