name: Build PS5 Payload

on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld git make python3
          
      - name: Install PS5 SDK
        run: |
          # 换回维护最好、编译最快的新版 SDK，并完整克隆
          git clone --recursive https://github.com/john-tornblom/ps5-payload-sdk.git
          cd ps5-payload-sdk
          make
          sudo make install
          
      - name: Compile
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          
          # 智能搜索核心配置文件的真实位置 (抓取它到底被安装在了哪里)
          MK_PATH=$(find /opt/ps5-payload-sdk -name "payload.mk" | head -n 1)
          echo "已成功定位配置文件路径: $MK_PATH"
          
          # 现场直接生成一份完美的 Makefile，强行覆盖掉旧文件
          cat << EOF > Makefile
          TARGET = ps5-syslang.elf
          OBJS = main.o
          CXXFLAGS = -O2 -Wall -std=c++11
          include $MK_PATH
          EOF
          
          # 开始最终的编译
          make
          
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: ps5-syslang-elf
          path: ps5-syslang.elf
