name: Build PS5 Payload

on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld git make
          
      - name: Build SDK & Hijack Sample
        run: |
          # 1. 下载新版 SDK 并让它在当前机器上编译自身（绝不缺文件）
          git clone https://github.com/john-tornblom/ps5-payload-sdk.git
          cd ps5-payload-sdk
          make -j$(nproc)
          sudo make install
          
          # 2. 搜索 SDK 自带的测试样例目录（抓取官方原配的 Makefile）
          SAMPLE_MK=$(find . -mindepth 2 -name "Makefile" -exec grep -l "^ *include " {} + | head -n 1)
          SAMPLE_DIR=$(dirname "$SAMPLE_MK")
          echo "成功锁定 SDK 内部样例目录: $SAMPLE_DIR"
          
          # 3. 提取官方 Makefile 里的核心编译引入指令
          INCLUDE_LINE=$(grep "^ *include " "$SAMPLE_MK" | head -n 1)
          
          # 4. 狸猫换太子：重写样例的配置文件，把名字改成我们的插件
          cat << EOF > "$SAMPLE_DIR/Makefile"
          TARGET := ps5-syslang.elf
          OBJS := main.o
          CXXFLAGS := -O2 -Wall -std=c++11
          $INCLUDE_LINE
          EOF
          
          # 5. 毁尸灭迹：删掉样例原本的代码，把我们的 main.cpp 偷渡进去
          rm -f $SAMPLE_DIR/*.c $SAMPLE_DIR/*.cpp $SAMPLE_DIR/*.o
          cp ../main.cpp "$SAMPLE_DIR/main.cpp"
          
          # 6. 在样例目录里执行编译（用官方环境编译，绝对畅通无阻）
          cd "$SAMPLE_DIR"
          make
          
          # 7. 把编译好的成品提炼出来
          cp ps5-syslang.elf $GITHUB_WORKSPACE/
          
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: ps5-syslang-elf
          path: ps5-syslang.elf
