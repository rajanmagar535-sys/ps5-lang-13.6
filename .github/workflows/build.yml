name: Build PS5 Payload

on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld git
          
      - name: Prepare SDK
        run: |
          git clone https://github.com/ps5-payload-dev/sdk.git ps5-sdk
          
      - name: Compile
        run: |
          export PS5_PAYLOAD_SDK=$GITHUB_WORKSPACE/ps5-sdk
          make
          
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: ps5-syslang-elf
          path: ps5-syslang.elf
