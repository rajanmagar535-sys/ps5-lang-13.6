name: Build PS5 Payload

on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile using Official Docker
        run: |
          # 1. 把编译指令写成一个脚本
          cat << 'EOF' > build.sh
          #!/bin/bash
          set -e
          
          echo "正在大神官方环境中搜索编译模板..."
          # 自动抓取官方镜像里自带的 .mk 配置文件
          MK_PATH=$(find /opt/ps5-payload-sdk/share -name "*.mk" | head -n 1)
          echo "成功找到模板: $MK_PATH"
          
          echo "正在生成 Makefile..."
          cat << MAKEFILE > Makefile
          TARGET = ps5-syslang.elf
          OBJS = main.o
          CXXFLAGS = -O2 -Wall -std=c++11
          PS5_PAYLOAD_SDK = /opt/ps5-payload-sdk
          include $MK_PATH
          MAKEFILE
          
          echo "开始最终编译..."
          make
          EOF
          
          chmod +x build.sh
          
          # 2. 召唤大神的官方 PS5 SDK 镜像，并在里面运行上面的脚本
          docker run --rm -v ${{ github.workspace }}:/src -w /src ghcr.io/john-tornblom/ps5-payload-sdk:latest ./build.sh
          
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: ps5-syslang-elf
          path: "*.elf"
