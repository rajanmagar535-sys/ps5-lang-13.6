name: Build PS5 Payload

on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld git
          
      - name: Compile
        run: |
          # 1. 专门下载原作者当年使用的老版 SDK (完美对齐路径)
          git clone https://github.com/ps5-payload-dev/sdk.git ps5-sdk
          export PS5_PAYLOAD_SDK=$GITHUB_WORKSPACE/ps5-sdk
          
          # 2. 下载原作者的源码项目
          git clone https://github.com/owendswang/ps5-syslang.git build_dir
          
          # 3. 将我们仓库里的 main.cpp (已修改sprx后缀)，强行覆盖进去
          cp main.cpp build_dir/main.cpp
          
          # 4. 进入文件夹，使用原作者自带的 Makefile 编译
          cd build_dir
          make
          
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: ps5-syslang-elf
          path: build_dir/*.elf
